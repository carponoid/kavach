server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # Health endpoint for local checks and tunnel diagnostics.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # Dashboard landing page.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Layer-1 app path proxies. Access auth happens once at the edge on kavach.thepkb.in.
    location /apps/adguard/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /apps/adguard;
        # AdGuard emits root-relative and absolute redirects.
        # Rewrite them back under the dashboard prefix using relative paths.
        proxy_redirect ~^https?://[^/]+(/.*)$ /apps/adguard$1;
        proxy_redirect ~^(/.*)$ /apps/adguard$1;
    }

    # Compatibility shim for AdGuard pages that still resolve to root-level paths.
    # Keep this above dashboard root handling so /login.html doesn't 404.
    location = /login.html {
        proxy_pass http://127.0.0.1:3000/login.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /apps/adguard;
    }

    location = /install.html {
        proxy_pass http://127.0.0.1:3000/install.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /apps/adguard;
    }

    location /control/ {
        proxy_pass http://127.0.0.1:3000/control/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /apps/adguard;
        proxy_redirect ~^https?://[^/]+(/.*)$ /apps/adguard$1;
        proxy_redirect ~^(/.*)$ /apps/adguard$1;
    }

    location /apps/traccar/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /apps/traccar;
    }

    location /apps/fmd/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /apps/fmd;
    }

    location /apps/mdm/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /apps/mdm;
    }

    location /apps/approver/ {
        proxy_pass http://127.0.0.1:8084/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /apps/approver;
    }
}
