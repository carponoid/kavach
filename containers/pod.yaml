apiVersion: v1
kind: Pod
metadata:
  name: kavach
  labels:
    app: kavach
    component: family-safety
spec:
  hostNetwork: false
  restartPolicy: Always
  containers:
    - name: adguard
      image: docker.io/adguard/adguardhome:latest
      args:
        - "-c"
        - "/opt/adguardhome/conf/AdGuardHome.yaml"
        - "-w"
        - "/opt/adguardhome/work"
      ports:
        - containerPort: 3000
          hostPort: 24278
          hostIP: 127.0.0.1
          protocol: TCP
        - containerPort: 80
          hostPort: 24284
          hostIP: 127.0.0.1
          protocol: TCP
        - containerPort: 443
          hostPort: 24283
          hostIP: 127.0.0.1
          protocol: TCP
      volumeMounts:
        - name: adguard-conf
          mountPath: /opt/adguardhome/conf
        - name: adguard-work
          mountPath: /opt/adguardhome/work
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"

    - name: traccar
      image: docker.io/traccar/traccar:latest
      ports:
        - containerPort: 8082
          hostPort: 24279
          hostIP: 127.0.0.1
          protocol: TCP
      volumeMounts:
        - name: traccar-conf
          mountPath: /opt/traccar/conf
        - name: traccar-data
          mountPath: /opt/traccar/data
        - name: traccar-log
          mountPath: /opt/traccar/logs
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "1000m"

    - name: fmd
      image: registry.gitlab.com/fmd-foss/fmd-server:0.16.0
      command:
        - /opt/fmd-server
      args:
        - serve
        - --config
        - /etc/fmd/config.yml
        - --db-dir
        - /var/lib/fmd-server/db
      securityContext:
        runAsUser: 0
      ports:
        - containerPort: 8083
          hostPort: 24280
          hostIP: 127.0.0.1
          protocol: TCP
      volumeMounts:
        - name: fmd-conf
          mountPath: /etc/fmd
        - name: fmd-db
          mountPath: /var/lib/fmd-server/db
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"

    - name: mdm-db
      image: docker.io/library/postgres:16-alpine
      env:
        - name: POSTGRES_DB
          value: hmdm
        - name: POSTGRES_USER
          value: hmdm
        - name: POSTGRES_PASSWORD
          value: hmdm-change-me
      volumeMounts:
        - name: mdm-postgres
          mountPath: /var/lib/postgresql/data
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"

    - name: mdm
      image: docker.io/headwindmdm/hmdm:0.1.9
      env:
        - name: SQL_HOST
          value: 127.0.0.1
        - name: SQL_PORT
          value: "5432"
        - name: SQL_BASE
          value: hmdm
        - name: SQL_USER
          value: hmdm
        - name: SQL_PASS
          value: hmdm-change-me
        - name: BASE_DOMAIN
          value: mdm-kavach.thepkb.in
        - name: PROTOCOL
          value: http
        - name: HTTPS_LETSENCRYPT
          value: "false"
      ports:
        - containerPort: 8080
          hostPort: 24281
          hostIP: 127.0.0.1
          protocol: TCP
        - containerPort: 31000
          protocol: TCP
      volumeMounts:
        - name: mdm-work
          mountPath: /usr/local/tomcat/work
      resources:
        requests:
          memory: "384Mi"
          cpu: "250m"
        limits:
          memory: "1024Mi"
          cpu: "1000m"

    - name: approver
      image: localhost/kavach-approver:latest
      command:
        - uvicorn
      args:
        - app:app
        - --host
        - 0.0.0.0
        - --port
        - "8084"
      env:
        - name: APPROVER_DATA_DIR
          value: /data
      ports:
        - containerPort: 8084
          hostPort: 24282
          hostIP: 127.0.0.1
          protocol: TCP
      volumeMounts:
        - name: approver-data
          mountPath: /data
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "250m"

    - name: dashboard
      image: docker.io/library/nginx:1.27-alpine
      ports:
        - containerPort: 80
          protocol: TCP
      volumeMounts:
        - name: dashboard-content
          mountPath: /usr/share/nginx/html
        - name: dashboard-nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
      resources:
        requests:
          memory: "32Mi"
          cpu: "25m"
        limits:
          memory: "64Mi"
          cpu: "100m"
  volumes:
    - name: adguard-conf
      hostPath:
        path: /ai/kavach/adguard/conf
        type: DirectoryOrCreate
    - name: adguard-work
      hostPath:
        path: /ai/kavach/adguard/work
        type: DirectoryOrCreate
    - name: traccar-conf
      hostPath:
        path: /ai/kavach/traccar/conf
        type: DirectoryOrCreate
    - name: traccar-data
      hostPath:
        path: /ai/kavach/traccar/data
        type: DirectoryOrCreate
    - name: traccar-log
      hostPath:
        path: /ai/kavach/traccar/logs
        type: DirectoryOrCreate
    - name: fmd-conf
      hostPath:
        path: /ai/kavach/fmd/conf
        type: DirectoryOrCreate
    - name: fmd-db
      hostPath:
        path: /ai/kavach/fmd/db
        type: DirectoryOrCreate
    - name: mdm-postgres
      hostPath:
        path: /ai/kavach/mdm/postgres
        type: DirectoryOrCreate
    - name: mdm-work
      hostPath:
        path: /ai/kavach/mdm/work
        type: DirectoryOrCreate
    - name: approver-data
      hostPath:
        path: /ai/kavach/approver/data
        type: DirectoryOrCreate
    - name: dashboard-content
      hostPath:
        path: /ai/kavach/dashboard
        type: DirectoryOrCreate
    - name: dashboard-nginx-conf
      hostPath:
        path: /ai/kavach/dashboard/default.conf
        type: FileOrCreate
